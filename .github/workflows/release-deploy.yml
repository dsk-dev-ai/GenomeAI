name: Deploy Release (Live Demo)

# Automatically deploys a released version to the public free hosts and
# verifies the live demo actually works.
#
# Trigger: a GitHub Release tag matching v* (e.g. v1.0.0, v1.1.0, v2.0.0)
# created on the main branch. Manual rerun via "Run workflow" is supported.
#
# Flow:
#   tag -> checkout -> install -> build + tests -> deploy backend (Render)
#        -> deploy frontend (Vercel, NEXT_PUBLIC_GENOMEAI_API_URL=backend URL)
#        -> health check both public URLs -> real API + UI smoke test
#
# Required GitHub Actions secrets (Settings > Secrets and variables > Actions):
#   VERCEL_TOKEN            - Vercel personal access token
#   VERCEL_ORG_ID           - Vercel team/user ID (from ~/.vercel/project.json)
#   VERCEL_PROJECT_ID       - Vercel project ID (from ~/.vercel/project.json)
#   RENDER_DEPLOY_HOOK_URL  - Render service deploy hook URL (Settings -> Deploy Hook)
#
# Required repository variables (Settings > Secrets and variables > Actions > Variables):
#   GENOMEAI_FRONTEND_URL   - public frontend URL, e.g. https://<project>.vercel.app
#   GENOMEAI_BACKEND_URL    - public backend URL,  e.g. https://genomeai-api.onrender.com

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  release:
    name: Build, Test, Deploy & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Install Python dependencies
        run: uv sync --frozen --all-packages

      - name: Lint & format check
        run: |
          pnpm exec biome check packages/ apps/
          uv run ruff check packages/ apps/

      - name: Type check
        run: uv run pyright

      - name: Run tests
        run: |
          pnpm turbo test
          uv run pytest || test $? -eq 5

      - name: Build web app
        run: pnpm turbo build

      - name: Require Render deploy hook URL
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set."
            echo "Create the Render service from render.yaml, then copy its deploy hook"
            echo "URL into Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy backend to Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        timeout-minutes: 2

      - name: Deploy frontend to Vercel (Release)
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: ./apps/web
          target: production
          github-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          build-env: |
            NEXT_PUBLIC_GENOMEAI_API_URL=${{ vars.GENOMEAI_BACKEND_URL }}

      - name: Wait for backend health
        env:
          BACKEND_URL: ${{ vars.GENOMEAI_BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::GENOMEAI_BACKEND_URL repository variable is not set."
            exit 1
          fi
          echo "Waiting for backend at $BACKEND_URL ..."
          for i in $(seq 1 90); do
            code=$(curl -sS -o /tmp/backend_health.json -w "%{http_code}" \
              -H "Accept: application/json" "$BACKEND_URL/health" || true)
            if [ "$code" = "200" ]; then
              echo "Backend healthy (HTTP 200)."
              cat /tmp/backend_health.json
              echo
              exit 0
            fi
            echo "  attempt $i: HTTP $code (sleeping 10s)"
            sleep 10
          done
          echo "::error::Backend did not become healthy within the timeout."
          exit 1
        timeout-minutes: 16

      - name: Wait for frontend
        env:
          FRONTEND_URL: ${{ vars.GENOMEAI_FRONTEND_URL }}
        run: |
          if [ -z "$FRONTEND_URL" ]; then
            echo "::error::GENOMEAI_FRONTEND_URL repository variable is not set."
            exit 1
          fi
          echo "Waiting for frontend at $FRONTEND_URL ..."
          for i in $(seq 1 60); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$FRONTEND_URL/" || true)
            if [ "$code" = "200" ]; then
              echo "Frontend reachable (HTTP 200)."
              exit 0
            fi
            echo "  attempt $i: HTTP $code (sleeping 10s)"
            sleep 10
          done
          echo "::error::Frontend did not become reachable within the timeout."
          exit 1
        timeout-minutes: 11

      - name: Smoke test — public backend real API
        env:
          BACKEND_URL: ${{ vars.GENOMEAI_BACKEND_URL }}
        run: |
          echo "Calling POST $BACKEND_URL/api/v1/genes/analyze ..."
          payload='{"symbol":"BRCA1"}'
          for i in $(seq 1 3); do
            resp=$(curl -sS -w '\n%{http_code}' -X POST \
              -H "Content-Type: application/json" -d "$payload" \
              "$BACKEND_URL/api/v1/genes/analyze" || true)
            code=$(echo "$resp" | tail -n1)
            body=$(echo "$resp" | head -n -1)
            if [ "$code" = "200" ]; then
              echo "Real API smoke test passed (HTTP 200)."
              echo "$body" | head -c 400
              echo
              exit 0
            fi
            echo "  attempt $i: HTTP $code (retrying)"
            sleep 5
          done
          echo "::error::Real API smoke test failed. Body: $body"
          exit 1
        timeout-minutes: 3

      - name: Smoke test — public frontend UI renders
        env:
          FRONTEND_URL: ${{ vars.GENOMEAI_FRONTEND_URL }}
        run: |
          html=$(curl -sS "$FRONTEND_URL/" || true)
          for marker in "<!doctype html" "__next" "GenomeAI"; do
            if ! echo "$html" | grep -qi "$marker"; then
              echo "::error::Frontend HTML missing expected marker: $marker"
              echo "${html:0:400}"
              exit 1
            fi
          done
          echo "Frontend UI smoke test passed (HTML contains expected markers)."

      - name: Comment release deploy status
        if: always() && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          STATUS="${{ job.status }}"
          RUN="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$STATUS" = "success" ]; then
            SUMMARY=$'## :white_check_mark: Live demo deploy succeeded\n\nThe released version is live. See the [workflow run]('"$RUN"$') for details.'
          else
            SUMMARY=$'## :x: Live demo deploy failed\n\nThe release workflow did not complete successfully. See the [workflow run]('"$RUN"$') for logs.'
          fi
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.id' 2>/dev/null || true)
          if [ -n "$RELEASE_ID" ]; then
            gh api -X POST "repos/${{ github.repository }}/releases/$RELEASE_ID/comments" \
              -f body="$SUMMARY" >/dev/null 2>&1 || true
          fi