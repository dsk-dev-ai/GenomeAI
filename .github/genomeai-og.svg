<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="dna1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <g stroke="url(#dna1)" stroke-width="10" fill="none" opacity="0.9">
    <path d="M 880 80 C 970 200, 790 240, 880 320 C 970 400, 790 440, 880 560"/>
    <path d="M 1100 80 C 1010 200, 1190 240, 1100 320 C 1010 400, 1190 440, 1100 560"/>
  </g>
  <g stroke="#a5f3fc" stroke-width="10" fill="none" opacity="0.9">
    <path d="M 880 105 C 970 225, 790 265, 880 345 C 970 425, 790 465, 880 585"/>
  </g>

  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="90" y="250" font-size="120" font-weight="bold" fill="#f8fafc">GenomeAI</text>
    <text x="90" y="330" font-size="46" fill="#7dd3fc">Open-source AI for genomics &amp; bioinformatics</text>
    <text x="90" y="400" font-size="36" fill="#94a3b8">37+ public science APIs · multi-provider LLMs · free &amp; open</text>
    <text x="90" y="470" font-size="28" fill="#2dd4bf">https://genomeai.vercel.app</text>
    <rect x="90" y="500" width="360" height="14" rx="7" opacity="0">
      <animate attributeName="width" from="0" to="360" dur="1s"/>
    </rect>
  </g>

  <g font-family="DejaVu Sans, Arial, sans-serif">
    <rect x="880" y="470" width="300" height="70" rx="14" fill="#059669"/>
    <text x="1030" y="518" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff">LIVE DEMO</text>
  </g>
  <circle cx="1240" cy="40" r="30" fill="#064e3b"/>
</svg>